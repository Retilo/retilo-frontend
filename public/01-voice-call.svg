<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <pattern id="rg1" patternUnits="userSpaceOnUse" width="320" height="480">
      <rect width="320" height="480" fill="#fdfaf3"></rect>
    </pattern>
  </defs>
  
  <path d="M0,12 L8,4 L20,10 L32,2 L46,10 L60,4 L74,10 L90,2 L104,10 L118,4 L132,10 L148,2 L162,10 L176,4 L190,10 L204,2 L218,10 L232,4 L246,10 L260,2 L274,10 L288,4 L300,10 L312,2 L320,8 L320,480 L0,480 Z" fill="url(#rg1)" stroke="#0e0a06" stroke-width="0.4"></path>

  <g font-family="JetBrains Mono, monospace" fill="#0e0a06">
    <text x="160" y="48" text-anchor="middle" font-size="11" letter-spacing="3">RETILO · VOICE</text>
    <text x="160" y="68" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="20">A call, decoded.</text>
    <line x1="40" y1="92" x2="280" y2="92" stroke="#0e0a06" stroke-width="0.5" stroke-dasharray="2 3"></line>

    <text x="40" y="124" font-size="9" letter-spacing="2" fill="#8a7a6a">01 · CALLER SPEAKS</text>
    <text x="40" y="142" font-family="Instrument Serif, serif" font-style="italic" font-size="14">&#34;velvet kurta, medium…&#34;</text>

    <text x="40" y="180" font-size="9" letter-spacing="2" fill="#8a7a6a">02 · INTENT EXTRACTED</text>
    <g transform="translate(40, 196)">
      <rect width="240" height="22" fill="none" stroke="#0e0a06" stroke-width="0.4"></rect>
      <text x="8" y="15" font-size="10">PURCHASE · URGENT · M</text>
    </g>

    <text x="40" y="248" font-size="9" letter-spacing="2" fill="#8a7a6a">03 · INVENTORY MATCH</text>
    <g transform="translate(40, 264)">
      <rect width="240" height="22" fill="none" stroke="#1e6b56" stroke-width="0.6"></rect>
      <text x="8" y="15" font-size="10" fill="#1e6b56">2 IN STOCK · MAROON, OLIVE</text>
    </g>

    <text x="40" y="316" font-size="9" letter-spacing="2" fill="#8a7a6a">04 · RESPONSE</text>
    <text x="40" y="334" font-family="Instrument Serif, serif" font-style="italic" font-size="14">&#34;Yes — I&#39;ll hold it.&#34;</text>

    <text x="40" y="372" font-size="9" letter-spacing="2" fill="#8a7a6a">05 · LOGGED</text>
    <text x="40" y="390" font-size="11">CRM · LEAD · #04832</text>

    <line x1="40" y1="420" x2="280" y2="420" stroke="#0e0a06" stroke-width="0.5" stroke-dasharray="2 3"></line>
    <text x="160" y="442" text-anchor="middle" font-size="10">1.4S · ZERO MISSED</text>
    <text x="160" y="460" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="11" fill="#c8543d">— end of receipt —</text>
  </g>
