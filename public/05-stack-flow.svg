<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <rect width="320" height="480" fill="#fdfaf3"></rect>
  <path d="M0,12 L8,4 L20,10 L32,2 L46,10 L60,4 L74,10 L90,2 L104,10 L118,4 L132,10 L148,2 L162,10 L176,4 L190,10 L204,2 L218,10 L232,4 L246,10 L260,2 L274,10 L288,4 L300,10 L312,2 L320,8" fill="none" stroke="#0e0a06" stroke-width="0.4"></path>
  <line x1="0" y1="468" x2="320" y2="468" stroke="#0e0a06" stroke-width="0.4" stroke-dasharray="3 3"></line>

  <g font-family="JetBrains Mono, monospace" fill="#0e0a06">
    <text x="160" y="48" text-anchor="middle" font-size="11" letter-spacing="3">RETILO · STACK</text>
    <text x="160" y="68" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="20">How four threads weave.</text>
    <line x1="40" y1="92" x2="280" y2="92" stroke="#0e0a06" stroke-width="0.5" stroke-dasharray="2 3"></line>

    
    <g transform="translate(40, 116)">
      
      <rect width="240" height="42" fill="none" stroke="#0e0a06" stroke-width="0.6"></rect>
      <text x="14" y="18" font-size="9" letter-spacing="2" fill="#8a7a6a">01 · VOICE</text>
      <text x="14" y="34" font-family="Instrument Serif, serif" font-style="italic" font-size="14">listens to every call.</text>
      <text x="226" y="34" text-anchor="end" font-size="10" fill="#c8543d">↓ intent</text>
    </g>

    <line x1="160" y1="158" x2="160" y2="170" stroke="#c8543d" stroke-width="1" stroke-dasharray="2 2"></line>

    <g transform="translate(40, 170)">
      <rect width="240" height="42" fill="none" stroke="#0e0a06" stroke-width="0.6"></rect>
      <text x="14" y="18" font-size="9" letter-spacing="2" fill="#8a7a6a">02 · LOCAL</text>
      <text x="14" y="34" font-family="Instrument Serif, serif" font-style="italic" font-size="14">maps the street around it.</text>
      <text x="226" y="34" text-anchor="end" font-size="10" fill="#c8543d">↓ context</text>
    </g>

    <line x1="160" y1="212" x2="160" y2="224" stroke="#c8543d" stroke-width="1" stroke-dasharray="2 2"></line>

    <g transform="translate(40, 224)">
      <rect width="240" height="42" fill="none" stroke="#0e0a06" stroke-width="0.6"></rect>
      <text x="14" y="18" font-size="9" letter-spacing="2" fill="#8a7a6a">03 · SIGNALS</text>
      <text x="14" y="34" font-family="Instrument Serif, serif" font-style="italic" font-size="14">forecasts the week ahead.</text>
      <text x="226" y="34" text-anchor="end" font-size="10" fill="#c8543d">↓ forecast</text>
    </g>

    <line x1="160" y1="266" x2="160" y2="278" stroke="#c8543d" stroke-width="1" stroke-dasharray="2 2"></line>

    <g transform="translate(40, 278)">
      <rect width="240" height="42" fill="#0e0a06" stroke="#0e0a06" stroke-width="0.6"></rect>
      <text x="14" y="18" font-size="9" letter-spacing="2" fill="#d99a3a">04 · GRADER</text>
      <text x="14" y="34" font-family="Instrument Serif, serif" font-style="italic" font-size="14" fill="#fdfaf3">scores it weekly.</text>
      <text x="226" y="34" text-anchor="end" font-size="10" fill="#fdfaf3">→ score</text>
    </g>

    <line x1="40" y1="338" x2="280" y2="338" stroke="#0e0a06" stroke-width="0.5" stroke-dasharray="2 3"></line>

    <text x="160" y="364" text-anchor="middle" font-size="9" letter-spacing="2" fill="#8a7a6a">ONE LOOP · COMPOUNDING</text>
    <text x="160" y="396" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="20">+4.1 pts every quarter.</text>

    <text x="160" y="438" text-anchor="middle" font-size="9" letter-spacing="2" fill="#c8543d">EVERY MODULE TEACHES THE OTHERS</text>
    <text x="160" y="458" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="11" fill="#5a4a3c">— retilo, end of run —</text>
  </g>
</svg>