<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="2" cy="2" r="1" fill="#c8543d" opacity="0.45"></circle>
    </pattern>
    <pattern id="lightDots" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="2" cy="2" r="0.8" fill="#d99a3a" opacity="0.35"></circle>
    </pattern>
    <filter id="grainPlate">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 0 0.02  0 0 0 0.05 0"></feColorMatrix>
      <feComposite in2="SourceGraphic" operator="in"></feComposite>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#f6f0e6"></rect>
  <rect width="1200" height="1200" filter="url(#grainPlate)"></rect>

  
  <rect x="60" y="60" width="1080" height="1080" fill="none" stroke="#0e0a06" stroke-width="1.4"></rect>
  <rect x="74" y="74" width="1052" height="1052" fill="none" stroke="#0e0a06" stroke-width="0.5"></rect>

  
  <g transform="translate(600, 130)">
    <text text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="40" fill="#0e0a06">Indiranagar</text>
    <text y="32" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="6" fill="#8a7a6a">FOUR BLOCKS · 12 MAIN ROAD</text>
    <line x1="-180" y1="50" x2="180" y2="50" stroke="#0e0a06" stroke-width="0.6"></line>
  </g>

  
  <g transform="translate(150, 230)" stroke="#0e0a06" fill="none">
    
    <rect width="900" height="800" stroke-width="1.3"></rect>
    <line x1="300" y1="0" x2="300" y2="800" stroke-width="0.9"></line>
    <line x1="600" y1="0" x2="600" y2="800" stroke-width="0.9"></line>
    <line x1="0" y1="260" x2="900" y2="260" stroke-width="0.9"></line>
    <line x1="0" y1="520" x2="900" y2="520" stroke-width="0.9"></line>

    
    <line x1="150" y1="0" x2="150" y2="260" stroke-width="0.4" stroke-dasharray="3 4"></line>
    <line x1="450" y1="260" x2="450" y2="520" stroke-width="0.4" stroke-dasharray="3 4"></line>
    <line x1="750" y1="520" x2="750" y2="800" stroke-width="0.4" stroke-dasharray="3 4"></line>

    
    <rect x="300" y="260" width="300" height="260" fill="url(#dots)" stroke="none"></rect>
    <rect x="0" y="520" width="300" height="280" fill="url(#lightDots)" stroke="none"></rect>
    <rect x="600" y="0" width="300" height="260" fill="url(#lightDots)" stroke="none"></rect>

    
    <g font-family="Instrument Serif, serif" font-style="italic" font-size="18" fill="#0e0a06" stroke="none">
      <text x="150" y="50" text-anchor="middle">12th Cross</text>
      <text x="450" y="50" text-anchor="middle">Defence Colony</text>
      <text x="750" y="50" text-anchor="middle">100 Ft Rd</text>
      <text x="450" y="290" text-anchor="middle">Market Sq.</text>
      <text x="150" y="560" text-anchor="middle">Old Bazaar</text>
    </g>

    
    <g fill="#0e0a06" stroke="none" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">
      <circle cx="180" cy="160" r="3"></circle>
      <text x="190" y="163">a</text>
      <circle cx="720" cy="180" r="3"></circle>
      <text x="730" y="183">b</text>
      <circle cx="160" cy="660" r="3"></circle>
      <text x="170" y="663">c</text>
      <circle cx="780" cy="700" r="3"></circle>
      <text x="790" y="703">d</text>
      <circle cx="380" cy="430" r="3"></circle>
      <text x="390" y="433">e</text>
    </g>

    
    <g transform="translate(450, 380)">
      <circle r="10" fill="#c8543d"></circle>
      <circle r="22" fill="none" stroke="#c8543d" stroke-width="0.8" opacity="0.5"></circle>
      <text x="18" y="6" font-family="Instrument Serif, serif" font-style="italic" font-size="20" fill="#0e0a06" stroke="none">your shop</text>
    </g>
  </g>

  
  <g transform="translate(990, 1080)" stroke="#0e0a06" fill="#0e0a06">
    <circle r="32" fill="none" stroke-width="0.6"></circle>
    <line x1="0" y1="-32" x2="0" y2="32" stroke-width="0.6"></line>
    <line x1="-32" y1="0" x2="32" y2="0" stroke-width="0.6"></line>
    <polygon points="0,-30 -4,0 4,0" fill="#c8543d" stroke="none"></polygon>
    <polygon points="0,30 -4,0 4,0" fill="#0e0a06" stroke="none"></polygon>
    <text y="-40" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="12" stroke="none">N</text>
  </g>

  
  <g transform="translate(110, 1080)" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#5a4a3c">
    <rect x="0" y="-10" width="14" height="14" fill="url(#dots)" stroke="#0e0a06" stroke-width="0.5"></rect>
    <text x="22" y="2">PEAK DEMAND</text>
    <rect x="160" y="-10" width="14" height="14" fill="url(#lightDots)" stroke="#0e0a06" stroke-width="0.5"></rect>
    <text x="182" y="2">WARM</text>
    <circle cx="260" cy="-3" r="4" fill="#c8543d"></circle>
    <text x="270" y="2">YOUR SHOP</text>
    <circle cx="380" cy="-3" r="3" fill="#0e0a06"></circle>
    <text x="390" y="2">COMPETITOR</text>
  </g>
</svg>